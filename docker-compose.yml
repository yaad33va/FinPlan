services:
  mysql:
    image: mysql:8.4
    container_name: finplan-mysql
    environment:
      MYSQL_DATABASE: finplan
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - finplan-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

volumes:
  finplan-mysql:
