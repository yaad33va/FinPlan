<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <defs>
    <linearGradient id="auth-wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="auth-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <circle cx="170" cy="150" r="130" fill="#ffffff" opacity="0.06"/>
  <circle cx="170" cy="150" r="96" fill="#ffffff" opacity="0.06"/>

  <!-- card behind the wallet -->
  <rect x="88" y="78" width="150" height="96" rx="12" fill="#86efac" transform="rotate(-8 163 126)"/>
  <rect x="98" y="100" width="70" height="8" rx="4" fill="#0f4d36" opacity="0.5" transform="rotate(-8 163 126)"/>

  <!-- wallet -->
  <rect x="70" y="110" width="190" height="130" rx="18" fill="url(#auth-wallet)"/>
  <rect x="70" y="110" width="190" height="30" rx="15" fill="#15803d" opacity="0.55"/>
  <rect x="196" y="160" width="76" height="46" rx="12" fill="#0f4d36"/>
  <circle cx="218" cy="183" r="9" fill="#86efac"/>

  <!-- shield with check -->
  <path d="M250 64l46 16v34c0 32-20 56-46 66-26-10-46-34-46-66V80z" fill="url(#auth-shield)" stroke="#0a2240" stroke-width="4" stroke-linejoin="round"/>
  <path d="M231 117l13 13 25-27" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coins -->
  <circle cx="72" cy="244" r="22" fill="#4ade80" stroke="#0f4d36" stroke-width="4"/>
  <path d="M78 236a8 7 0 1 0 0 16M64 241h12M64 247h12" fill="none" stroke="#0f4d36" stroke-width="3" stroke-linecap="round"/>
  <circle cx="114" cy="262" r="16" fill="#60a5fa" stroke="#0a2240" stroke-width="4"/>
</svg>
