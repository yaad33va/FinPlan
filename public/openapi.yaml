  schemas:
    CategoryType:
      type: string
      enum: [income, expense]
    PaymentMethod:
      type: string
      enum: [card, cash, bank_transfer]
    Link:
      type: object
      properties:
        href: { type: string, format: uri }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
    Links:
      type: object
      additionalProperties: { $ref: '#/components/schemas/Link' }

    Category:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Maistas ir buities prekės }
        type: { $ref: '#/components/schemas/CategoryType' }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true, example: '#EF6C00' }
        budgets_count: { type: integer, example: 3 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _links: { $ref: '#/components/schemas/Links' }
    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        type: { $ref: '#/components/schemas/CategoryType' }
        description: { type: string, maxLength: 1000, nullable: true }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true }
    CategoryPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        type: { $ref: '#/components/schemas/CategoryType' }
        description: { type: string, maxLength: 1000, nullable: true }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true }

    Budget:
      type: object
      properties:
        id: { type: integer, example: 9 }
        category_id: { type: integer, example: 3 }
        month: { type: string, example: '2026-09' }
        amount: { type: number, example: 400 }
        spent: { type: number, description: Sum of the budget's transactions, example: 261.99 }
        remaining: { type: number, description: amount − spent (negative when exceeded), example: 138.01 }
        usage_percent: { type: number, example: 65.5 }
        is_exceeded: { type: boolean, example: false }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _links: { $ref: '#/components/schemas/Links' }
    BudgetInput:
      type: object
      required: [month, amount]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10' }
        amount: { type: number, minimum: 0.01, maximum: 9999999999.99, example: 500 }
        note: { type: string, maxLength: 255, nullable: true }
    BudgetPatch:
      type: object
      minProperties: 1
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount: { type: number, minimum: 0.01, maximum: 9999999999.99 }
        note: { type: string, maxLength: 255, nullable: true }

    Transaction:
      type: object
      properties:
        id: { type: integer, example: 30 }
        budget_id: { type: integer, example: 9 }
        category_id: { type: integer, example: 3 }
        amount: { type: number, example: 64.04 }
        occurred_on: { type: string, format: date, example: '2026-09-16' }
        description: { type: string, example: Savaitės maisto pirkiniai }
        merchant: { type: string, nullable: true, example: Rimi }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _links: { $ref: '#/components/schemas/Links' }
    TransactionInput:
      type: object
      required: [amount, occurred_on, description, payment_method]
      properties:
        amount: { type: number, minimum: 0.01, maximum: 9999999999.99 }
        occurred_on: { type: string, format: date, description: Must be within the budget month }
        description: { type: string, minLength: 2, maxLength: 255 }
        merchant: { type: string, maxLength: 100, nullable: true }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
    TransactionPatch:
      type: object
      minProperties: 1
      properties:
        amount: { type: number, minimum: 0.01, maximum: 9999999999.99 }
        occurred_on: { type: string, format: date }
        description: { type: string, minLength: 2, maxLength: 255 }
        merchant: { type: string, maxLength: 100, nullable: true }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }

    PaginatedResponse:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: string, format: uri }
            last: { type: string, format: uri }
            prev: { type: string, format: uri, nullable: true }
            next: { type: string, format: uri, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }
            path: { type: string, format: uri }
        _links: { $ref: '#/components/schemas/Links' }
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
